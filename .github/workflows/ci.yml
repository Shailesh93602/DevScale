name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────
  backend-audit:
    name: Backend — security audit
    runs-on: ubuntu-latest
    # BLOCKING, and it audits what actually SHIPS (--omit=dev).
    #
    # This used to be `continue-on-error: true` running a full-tree audit, and
    # it had been red on every PR since June. A check that can never pass is a
    # check nobody reads — and it hides the next real one. The full tree is
    # dominated by dev tooling (eslint plugins, opentelemetry, jest
    # transitives) that never runs in production, so it will essentially always
    # have an advisory open.
    #
    # Production deps are now at 0 high / 0 critical, so this can gate for real.
    # The informational full-tree scan below stays non-blocking.
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # What ships. This gates.
      - name: Security audit — production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The full tree, including dev tooling. Informational: a CVE in eslint or
      # jest is worth seeing and is not worth blocking a merge on, because it
      # does not run in production.
      - name: Security audit — full tree (informational)
        run: npm audit --audit-level=high || true

  backend-lint:
    name: Backend — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # Formatting is checked in CI because it had already rotted: 20 files across
  # both packages were committed with prettier drift, and nothing failed. The
  # sibling repos (KhataGO, portfolio) gained this gate earlier; this one was
  # missed, which is exactly how the drift accumulated unnoticed.
  backend-format:
    name: Backend — format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

  frontend-format:
    name: Frontend — format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

  backend-typecheck:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      # Stub URLs so `prisma generate`/`validate` can read the datasource env.
      # No DB is contacted — these commands only parse the schema.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript type-check
        run: npx tsc --noEmit

  backend-test:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    #
    # 143 backend tests existed and NONE of them ran in CI. The pipeline was
    # audit + lint + typecheck + build only, so a change could break every
    # assertion in the repo and still merge green.
    #
    # This job now runs ALL of them, battle.test.ts included, against the
    # postgres service below. That suite was previously excluded as "flaky" —
    # and it was, but not inherently: its DATABASE_URL resolved to REMOTE
    # production Supabase, so every query was a network round-trip. It took 220
    # of the run's ~230 seconds and failed intermittently on latency.
    #
    # Against a local database the same 34 tests pass in seconds. The flakiness
    # was the network, not the assertions, so excluding the suite would have
    # been treating a symptom.
    #
    # The image is pgvector/pgvector rather than plain postgres because the
    # Spine B migration does CREATE EXTENSION vector, which stock postgres does
    # not ship.
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # NOT the default `postgres`: production Supabase's database is also
          # named that, so the test-database guard refuses it on purpose.
          POSTGRES_DB: eduscale_test
        ports:
          - 5432:5432
        # Without the health check the job races the container and the first
        # migration fails on connection refused.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduscale_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eduscale_test
      # supabaseClient.ts calls createClient() at MODULE level, so importing
      # anything that transitively reaches it throws "supabaseUrl is required"
      # without these — even though the tests then mock every call.
      #
      # This is why the job earned its keep on its first run: rbac.test.ts
      # passed locally and failed here, because a local .env was quietly
      # supplying these and CI has no .env. Tests that read ambient config are
      # only "hermetic" on the machine that happens to have it.
      #
      # Deliberately fake. If a test ever actually reaches Supabase it should
      # fail loudly rather than silently talk to a real project.
      SUPABASE_URL: https://stub.supabase.co
      SUPABASE_PUBLISHABLE_KEY: stub-anon-key-for-tests
      SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key-for-tests
      JWT_SECRET: stub-jwt-secret-for-tests
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Real schema, so battle.test.ts can create and delete real rows.
      - name: Apply migrations to the service container
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test

  backend-build:
    name: Backend — build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck]
    defaults:
      run:
        working-directory: Backend
    env:
      # Stub URLs for `prisma generate` (schema parse only; no DB contacted).
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend-audit:
    name: Frontend — security audit
    runs-on: ubuntu-latest
    # BLOCKING against production deps — see the backend-audit note.
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # What ships. This gates.
      - name: Security audit — production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Full tree, informational — see the backend note.
      - name: Security audit — full tree (informational)
        run: npm audit --audit-level=high || true

  frontend-test:
    name: Frontend — unit tests
    runs-on: ubuntu-latest
    # Added with the backend job for the same reason: the vitest suite landed
    # in #5 and nothing ran it. Small now, which is exactly when to wire it up —
    # a suite that has never been enforced grows stale silently.
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      # Stub vars so Next.js build doesn't fail on missing env. The Supabase
      # client reads NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (not ANON_KEY) — an
      # empty value makes @supabase/ssr throw during prerender.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Accessibility ──────────────────────────────────────────────────────────
  #
  # Frontend/tests/accessibility.spec.ts already scanned the public routes with
  # axe-core, pinned to WCAG 2.1 AA. Nothing ran it — no Playwright job existed
  # in any repo in this workspace. The standard was right and only ran when
  # somebody remembered.
  #
  # PUBLIC ROUTES ONLY. The protected half needs a seeded database, a running
  # backend and a logged-in session; a job that is red for environmental reasons
  # teaches everyone to ignore it, and twenty-two public pages checked on every
  # PR is worth more than a comprehensive job nobody trusts.
  #
  # These pages render without the backend — they are marketing and auth forms
  # that only call the API on submit — which is exactly why this subset can run
  # against placeholder env values. Verified locally: 22 passed with no backend.
  frontend-a11y:
    name: Frontend — WCAG 2.1 AA (public routes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:5000
      # Not 3000 — see the note in playwright.config.ts. A dev box routinely has
      # a different app on 3000, and reuseExistingServer would then run the
      # whole suite against somebody else's site while reporting green.
      PORT: 3220
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium only. These axe rules cover markup, contrast, names and
      # heading order — none differ by engine, so more browsers would multiply
      # the runtime to re-confirm the same answer.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the WCAG sweep
        run: npx playwright test tests/accessibility.spec.ts --no-deps -g "Public"

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            Frontend/playwright-report/
            Frontend/test-results/
          retention-days: 7

  # ── Anonymous read-only surface ────────────────────────────────────────────
  #
  # What a visitor with NO session sees: /career-roadmap and /coding-challenges
  # answer 200 with content and a sign-in affordance, /battles/demo replays the
  # recorded battle without opening a socket, and /create-battle plus the
  # challenge editor still redirect to login. Its own config on purpose —
  # playwright.config.ts has a globalSetup that seeds battles through
  # Backend/.env, which this suite must never trigger.
  frontend-public:
    name: Frontend — anonymous read-only view
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:5000
      PORT: 3220
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the anonymous read-only suite
        run: npx playwright test -c playwright.public.config.ts

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-suite-report
          path: |
            Frontend/playwright-report/
            Frontend/test-results/
          retention-days: 7

  # ── Core Web Vitals & category budgets ─────────────────────────────────────
  #
  # A second opinion on the public routes. tests/accessibility.spec.ts is pinned
  # to wcag2a/2aa/21a/21aa, and a tag filter is a blind spot rather than a
  # scope — Lighthouse's first run here found `link-text` (two "Learn more"
  # links), which axe reports under `best-practice` rather than a WCAG tag. That
  # is both an SEO defect and WCAG 2.4.4, and the existing suite structurally
  # could not see it. Fixed; SEO went 92 -> 100.
  #
  # Every threshold in .lighthouserc.js was measured on this commit before being
  # set. A gate that is red on arrival gets disabled rather than fixed.
  frontend-vitals:
    name: Frontend — Web Vitals & budgets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A PRODUCTION build, not `next dev`. Dev mode compiles routes on demand
      # and ships unminified bundles, so its numbers describe a build nobody
      # deploys — measuring it would produce a budget that means nothing.
      - name: Build
        run: npm run build

      # Port 3220, matching .lighthouserc.js. Not 3000: a shared runner or a dev
      # box can already have something there, and lhci would then audit it.
      - name: Start the server
        run: npx next start -p 3220 &

      - name: Wait for the server
        run: npx --yes wait-on http://localhost:3220 --timeout 90000

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.js
