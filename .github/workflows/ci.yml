name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────
  backend-audit:
    name: Backend — security audit
    runs-on: ubuntu-latest
    # BLOCKING, and it audits what actually SHIPS (--omit=dev).
    #
    # This used to be `continue-on-error: true` running a full-tree audit, and
    # it had been red on every PR since June. A check that can never pass is a
    # check nobody reads — and it hides the next real one. The full tree is
    # dominated by dev tooling (eslint plugins, opentelemetry, jest
    # transitives) that never runs in production, so it will essentially always
    # have an advisory open.
    #
    # Production deps are now at 0 high / 0 critical, so this can gate for real.
    # The informational full-tree scan below stays non-blocking.
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # What ships. This gates.
      - name: Security audit — production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The full tree, including dev tooling. Informational: a CVE in eslint or
      # jest is worth seeing and is not worth blocking a merge on, because it
      # does not run in production.
      - name: Security audit — full tree (informational)
        run: npm audit --audit-level=high || true

  backend-lint:
    name: Backend — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  backend-typecheck:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      # Stub URLs so `prisma generate`/`validate` can read the datasource env.
      # No DB is contacted — these commands only parse the schema.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript type-check
        run: npx tsc --noEmit

  backend-test:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    #
    # 143 backend tests existed and NONE of them ran in CI. The pipeline was
    # audit + lint + typecheck + build only, so a change could break every
    # assertion in the repo and still merge green.
    #
    # This job now runs ALL of them, battle.test.ts included, against the
    # postgres service below. That suite was previously excluded as "flaky" —
    # and it was, but not inherently: its DATABASE_URL resolved to REMOTE
    # production Supabase, so every query was a network round-trip. It took 220
    # of the run's ~230 seconds and failed intermittently on latency.
    #
    # Against a local database the same 34 tests pass in seconds. The flakiness
    # was the network, not the assertions, so excluding the suite would have
    # been treating a symptom.
    #
    # The image is pgvector/pgvector rather than plain postgres because the
    # Spine B migration does CREATE EXTENSION vector, which stock postgres does
    # not ship.
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # NOT the default `postgres`: production Supabase's database is also
          # named that, so the test-database guard refuses it on purpose.
          POSTGRES_DB: eduscale_test
        ports:
          - 5432:5432
        # Without the health check the job races the container and the first
        # migration fails on connection refused.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduscale_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/eduscale_test
      # supabaseClient.ts calls createClient() at MODULE level, so importing
      # anything that transitively reaches it throws "supabaseUrl is required"
      # without these — even though the tests then mock every call.
      #
      # This is why the job earned its keep on its first run: rbac.test.ts
      # passed locally and failed here, because a local .env was quietly
      # supplying these and CI has no .env. Tests that read ambient config are
      # only "hermetic" on the machine that happens to have it.
      #
      # Deliberately fake. If a test ever actually reaches Supabase it should
      # fail loudly rather than silently talk to a real project.
      SUPABASE_URL: https://stub.supabase.co
      SUPABASE_PUBLISHABLE_KEY: stub-anon-key-for-tests
      SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key-for-tests
      JWT_SECRET: stub-jwt-secret-for-tests
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Real schema, so battle.test.ts can create and delete real rows.
      - name: Apply migrations to the service container
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test

  backend-build:
    name: Backend — build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck]
    defaults:
      run:
        working-directory: Backend
    env:
      # Stub URLs for `prisma generate` (schema parse only; no DB contacted).
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend-audit:
    name: Frontend — security audit
    runs-on: ubuntu-latest
    # BLOCKING against production deps — see the backend-audit note.
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # What ships. This gates.
      - name: Security audit — production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Full tree, informational — see the backend note.
      - name: Security audit — full tree (informational)
        run: npm audit --audit-level=high || true

  frontend-test:
    name: Frontend — unit tests
    runs-on: ubuntu-latest
    # Added with the backend job for the same reason: the vitest suite landed
    # in #5 and nothing ran it. Small now, which is exactly when to wire it up —
    # a suite that has never been enforced grows stale silently.
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      # Stub vars so Next.js build doesn't fail on missing env. The Supabase
      # client reads NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (not ANON_KEY) — an
      # empty value makes @supabase/ssr throw during prerender.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
