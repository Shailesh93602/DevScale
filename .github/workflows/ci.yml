name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────
  backend-audit:
    name: Backend — security audit
    runs-on: ubuntu-latest
    # BLOCKING, and it audits what actually SHIPS (--omit=dev).
    #
    # This used to be `continue-on-error: true` running a full-tree audit, and
    # it had been red on every PR since June. A check that can never pass is a
    # check nobody reads — and it hides the next real one. The full tree is
    # dominated by dev tooling (eslint plugins, opentelemetry, jest
    # transitives) that never runs in production, so it will essentially always
    # have an advisory open.
    #
    # Production deps are now at 0 high / 0 critical, so this can gate for real.
    # The informational full-tree scan below stays non-blocking.
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # What ships. This gates.
      - name: Security audit — production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The full tree, including dev tooling. Informational: a CVE in eslint or
      # jest is worth seeing and is not worth blocking a merge on, because it
      # does not run in production.
      - name: Security audit — full tree (informational)
        run: npm audit --audit-level=high || true

  backend-lint:
    name: Backend — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  backend-typecheck:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      # Stub URLs so `prisma generate`/`validate` can read the datasource env.
      # No DB is contacted — these commands only parse the schema.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript type-check
        run: npx tsc --noEmit

  backend-test:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    #
    # 143 backend tests existed and NONE of them ran in CI. The pipeline was
    # audit + lint + typecheck + build only, so a change could break every
    # assertion in the repo and still merge green. This job closes that.
    #
    # It excludes src/tests/battle.test.ts deliberately, and the reason is not
    # "it is slow" (though it is — 220s of the ~230s total). That suite talks to
    # a REAL Upstash Redis and a REAL database, neither of which exists in CI,
    # and it is measurably flaky as a result: run locally three times it failed
    # twice with 2 failures and passed once, with no code change in between.
    #
    # Wiring a flaky suite into a required check trains people to re-run CI
    # until it goes green, which destroys the value of every other check in the
    # file. The remaining 109 tests are hermetic — verified stable across three
    # consecutive local runs — so those are the ones that gate.
    #
    # Making battle.test.ts runnable in CI (a postgres service container and a
    # Redis service container, or mocking both) is worth doing separately.
    defaults:
      run:
        working-directory: Backend
    env:
      # Stub URLs so `prisma generate` can read the datasource. The tests that
      # run here mock their data access; no database is contacted.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
      # supabaseClient.ts calls createClient() at MODULE level, so importing
      # anything that transitively reaches it throws "supabaseUrl is required"
      # without these — even though the tests then mock every call.
      #
      # This is why the job earned its keep on its first run: rbac.test.ts
      # passed locally and failed here, because a local .env was quietly
      # supplying these and CI has no .env. Tests that read ambient config are
      # only "hermetic" on the machine that happens to have it.
      #
      # Deliberately fake. If a test ever actually reaches Supabase it should
      # fail loudly rather than silently talk to a real project.
      SUPABASE_URL: https://stub.supabase.co
      SUPABASE_PUBLISHABLE_KEY: stub-anon-key-for-tests
      SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key-for-tests
      JWT_SECRET: stub-jwt-secret-for-tests
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests (hermetic suites)
        run: npm run test:ci

  backend-build:
    name: Backend — build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck]
    defaults:
      run:
        working-directory: Backend
    env:
      # Stub URLs for `prisma generate` (schema parse only; no DB contacted).
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend-audit:
    name: Frontend — security audit
    runs-on: ubuntu-latest
    # BLOCKING against production deps — see the backend-audit note.
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # What ships. This gates.
      - name: Security audit — production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Full tree, informational — see the backend note.
      - name: Security audit — full tree (informational)
        run: npm audit --audit-level=high || true

  frontend-test:
    name: Frontend — unit tests
    runs-on: ubuntu-latest
    # Added with the backend job for the same reason: the vitest suite landed
    # in #5 and nothing ran it. Small now, which is exactly when to wire it up —
    # a suite that has never been enforced grows stale silently.
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      # Stub vars so Next.js build doesn't fail on missing env. The Supabase
      # client reads NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (not ANON_KEY) — an
      # empty value makes @supabase/ssr throw during prerender.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
