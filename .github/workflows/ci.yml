name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────
  backend-audit:
    name: Backend — security audit
    runs-on: ubuntu-latest
    # BLOCKING, and it audits what actually SHIPS (--omit=dev).
    #
    # This used to be `continue-on-error: true` running a full-tree audit, and
    # it had been red on every PR since June. A check that can never pass is a
    # check nobody reads — and it hides the next real one. The full tree is
    # dominated by dev tooling (eslint plugins, opentelemetry, jest
    # transitives) that never runs in production, so it will essentially always
    # have an advisory open.
    #
    # Production deps are now at 0 high / 0 critical, so this can gate for real.
    # The informational full-tree scan below stays non-blocking.
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # What ships. This gates.
      - name: Security audit — production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The full tree, including dev tooling. Informational: a CVE in eslint or
      # jest is worth seeing and is not worth blocking a merge on, because it
      # does not run in production.
      - name: Security audit — full tree (informational)
        run: npm audit --audit-level=high || true

  backend-lint:
    name: Backend — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  backend-typecheck:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      # Stub URLs so `prisma generate`/`validate` can read the datasource env.
      # No DB is contacted — these commands only parse the schema.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript type-check
        run: npx tsc --noEmit

  backend-build:
    name: Backend — build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-typecheck]
    defaults:
      run:
        working-directory: Backend
    env:
      # Stub URLs for `prisma generate` (schema parse only; no DB contacted).
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend-audit:
    name: Frontend — security audit
    runs-on: ubuntu-latest
    # BLOCKING against production deps — see the backend-audit note.
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # What ships. This gates.
      - name: Security audit — production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Full tree, informational — see the backend note.
      - name: Security audit — full tree (informational)
        run: npm audit --audit-level=high || true

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      # Stub vars so Next.js build doesn't fail on missing env. The Supabase
      # client reads NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (not ANON_KEY) — an
      # empty value makes @supabase/ssr throw during prerender.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
